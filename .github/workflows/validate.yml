name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-plugin.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON
        run: git ls-files -z '*.json' | xargs -0 -n1 jq empty
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - name: AGENTS.md matches CLAUDE.md
        run: bash scripts/gen-agents-md.sh --check

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/hooks/session-start.test.sh
      - run: bash tests/hooks/prompt-router.test.sh
      - run: bash tests/hooks/branch-protect.test.sh
      - run: bash tests/hooks/block-dangerous-commands.test.sh
      - run: bash tests/install-other-kit.test.sh
